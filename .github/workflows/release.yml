name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: umi-upload-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows and Linux packages
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          VERSION="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          go run scripts/package_release.go -out dist -version "${VERSION}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags "-s -w -X main.Version=${VERSION}" \
            -o dist/umi_upload-linux-amd64 .

          cd dist
          zip -9 -q umi_upload-linux-amd64.zip umi_upload-linux-amd64
          sha256sum umi_upload.exe umi_upload-windows-amd64.zip \
            umi_upload-linux-amd64 umi_upload-linux-amd64.zip > SHA256SUMS.txt

      - name: Publish release and keep the latest 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          REL_TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          REL_TITLE="UMI 数据中心 (${REL_TAG})"

          gh release create "${REL_TAG}" \
            dist/umi_upload.exe \
            dist/umi_upload-windows-amd64.zip \
            dist/umi_upload-linux-amd64 \
            dist/umi_upload-linux-amd64.zip \
            dist/SHA256SUMS.txt \
            --title "${REL_TITLE}" \
            --notes "自动构建自 main 分支提交 ${SHORT_SHA}。包含 Windows AMD64 和 Linux AMD64 版本。"

          gh release list --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[2:][] | .tagName' |
          while IFS= read -r old_tag; do
            [ -n "${old_tag}" ] || continue
            gh release delete "${old_tag}" --yes --cleanup-tag
          done
