name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping builds from publishing stale packages to the latest release.
concurrency:
  group: umi-upload-latest-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build package
        run: go run scripts/package_release.go -out dist

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: umi_upload-windows-amd64
          path: |
            dist/umi_upload.exe
            dist/umi_upload-windows-amd64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_TAG="latest"
          SHORT_SHA="${GITHUB_SHA::8}"
          REL_TITLE="UMI 数据中心 (main-${SHORT_SHA})"
          NOTES_FILE="$(mktemp)"
          {
            echo "自动构建自 `main` 分支提交 `${SHORT_SHA}`。"
            echo ""
            echo "### SHA-256"
            echo ' ```text'
            cat dist/SHA256SUMS.txt
            echo ' ```'
          } > "${NOTES_FILE}"

          if gh release view "${REL_TAG}" >/dev/null 2>&1; then
            gh release edit "${REL_TAG}" --title "${REL_TITLE}" --notes-file "${NOTES_FILE}" --target "${GITHUB_SHA}"
          else
            gh release create "${REL_TAG}" --title "${REL_TITLE}" --notes-file "${NOTES_FILE}" --target "${GITHUB_SHA}"
          fi

          gh release upload "${REL_TAG}" \
            dist/umi_upload.exe \
            dist/umi_upload-windows-amd64.zip \
            dist/SHA256SUMS.txt \
            --clobber
