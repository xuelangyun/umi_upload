name: Go CI

on:
  pull_request:
    branches: [main]

# Keep CI focused on the essential compile and package tests.

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check frontend JavaScript syntax
        run: for file in web/js/*.js; do node --check "$file"; done

      - name: Check frontend runtime globals
        run: node --test scripts/frontend_smoke_test.cjs

      - name: Run tests
        run: go test ./...

      - name: Build Windows executable
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/umi_upload.exe" .
